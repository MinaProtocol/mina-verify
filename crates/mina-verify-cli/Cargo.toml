[package]
name = "mina-verify-cli"
version = "0.1.0"
edition = "2021"
description = "CLI: verify a Mina block proof from a captured consensus-gossip payload."
license = "Apache-2.0"

[[bin]]
name = "mina-verify"
path = "src/main.rs"

[dependencies]
mina-verify = { path = "../mina-verify" }

# `cargo deb -p mina-verify-cli --no-build` builds one "mina-verify" .deb with all
# three workspace binaries (run `cargo build --release` first).
[package.metadata.deb]
name = "mina-verify"
maintainer = "O(1) Labs <build@o1labs.org>"
copyright = "2026, O(1) Labs"
section = "utils"
priority = "optional"
extended-description = "Trustless Mina chain-integrity monitoring: verify block proofs, Ouroboros Samasika fork-choice, a windowed chain monitor, and a live verify-before-ingest loop."
assets = [
    ["target/release/mina-verify", "usr/bin/", "755"],
    ["target/release/mina-verify-capture", "usr/bin/", "755"],
    ["target/release/mina-verify-monitor", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mina-verify/README.md", "644"],
]
