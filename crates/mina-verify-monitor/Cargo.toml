[package]
name = "mina-verify-monitor"
version = "0.0.1"
edition = "2021"
description = "Live trustless chain monitor: verify each gossiped block's proof before ingesting it."
license = "Apache-2.0"

[dependencies]
mina-verify = { path = "../mina-verify" }
mina-verify-capture = { path = "../mina-verify-capture" }
tokio = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# for the `to_precomputed` example: re-encode a captured block into precomputed JSON.
base64 = "0.22"
binprot = { workspace = true }
serde_json = { workspace = true }
