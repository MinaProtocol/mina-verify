[package]
name = "mina-verify"
version = "0.0.1"
edition = "2021"
description = "Trustless verification of Mina block proofs (Pickles/kimchi) from untrusted sources."
license = "Apache-2.0"

[dependencies]
mina-tree = { workspace = true }
mina-p2p-messages = { workspace = true }
mina-core = { workspace = true }
mina-curves = { workspace = true }
kimchi = { workspace = true }
poly-commitment = { workspace = true }
binprot = { workspace = true }
base64 = "0.22"
once_cell = { workspace = true }
serde_json = { workspace = true }
# Ingesting the OCaml `print_blockchain_snark_vk` output (Pickles VK JSON) into a
# kimchi VerifierIndex: parse big-endian hex field elements + build curve points.
serde = { version = "1", features = ["derive"] }
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
hex = "0.4"

[dev-dependencies]
mina-signer = { git = "https://github.com/o1-labs/proof-systems", rev = "ab84160fa2c22290a8506a7742ac1378879fc386" }
