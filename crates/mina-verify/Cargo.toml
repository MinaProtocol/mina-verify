[package]
name = "mina-verify"
version = "0.0.1"
edition = "2021"
description = "Trustless verification of Mina block proofs (Pickles/kimchi) from untrusted sources."
license = "Apache-2.0"

[dependencies]
mina-tree = { workspace = true }
mina-p2p-messages = { workspace = true }
mina-core = { workspace = true }
mina-curves = { workspace = true }
kimchi = { workspace = true }
poly-commitment = { workspace = true }
binprot = { workspace = true }
base64 = "0.22"
once_cell = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mina-signer = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
